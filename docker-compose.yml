services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gloval_db
      POSTGRES_USER: gloval_user
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - gloval_postgres:/var/lib/postgresql/data
volumes:
  gloval_postgres:
